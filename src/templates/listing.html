<main class="page-wrap">
  <div class="page-intro">
    <div class="section-no">VIETNOTE / $label</div>
    <h1 class="serif">$heading</h1>
    <p>$subtitle</p>
  </div>
  <div class="browse-toolbar">
    <div class="filter-list">$filters</div>
    <label class="browse-search">⌕ <input id="browseQuery" placeholder="이름이나 키워드 검색" aria-label="목록 검색"></label>
  </div>
  <p class="list-count" id="listCount"></p>
  <section class="browse-grid" id="browseGrid">
$cards
  </section>
  <p class="empty-state" id="browseEmpty" hidden>검색 결과가 없습니다. 다른 검색어로 찾아보세요.</p>
  $extra
</main>
